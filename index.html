<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Attacks</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <div class="body">
      <div>
        <input type="number" name="hpInput" id="hpInput" />
        <input type="button" value="Generate HP" id="hpBtn" />
      </div>
      <div class="hp">
        <div class="hpBorder" id="hpBorder">
          <div class="hpBar">
            <div class="hpVisual" id="hpVisual"></div>
          </div>
        </div>
        <p class="currentHP" id="currentHP"></p>
      </div>
      <div class="attackBtn"></div>
      <p id="attackText"></p>
    </div>
    <script src="app/app.js"></script>
  </body>
</html>
